name: Pipeline de Seguranca LFD121

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    analise-seguranca:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout do Código
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

            - name: Configurar Python
              uses: actions/setup-python@42375524e23c212d90fb27447db6754ab997675f # v5.3.0
              with:
                  python-version: "3.11"

            - name: Executar Semgrep (SAST)
              uses: semgrep/semgrep-action@784534dc9b497405be7fb9f0b78e24fa2a912bb0 # v1.x
              with:
                  config: auto

            - name: Executar pip-audit (SCA)
              run: |
                  pip install pip-audit
                  pip-audit -r requirements.txt

            - name: Construir Imagem Docker
              run: |
                  docker build -t lab-seguranca:latest .

            - name: Executar Container Scanning (trivy)
              uses: aquasecurity/trivy-action@18f254131b70c6248c8b2574e402927c320d5757 # 0.29.0
              with:
                  image-ref: "lab-seguranca:latest"
                  format: "table"
                  exit-code: "0"
                  vuln-type: "os,library"
                  severity: "CRITICAL,HIGH"
